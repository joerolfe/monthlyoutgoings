<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Monthly Outgoings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column. Big "still to pay" figure on top, tick list below, add form last. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --fg:#14201f; --muted:#5d6e6c; --line:#dde3e3;
  --accent:#0d7a6b; --accent-soft:#d9efeb; --warn:#a85a00; --warn-soft:#fbead2;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#172221; --fg:#e6efee; --muted:#93a8a5; --line:#273837;
  --accent:#3fc2ad; --accent-soft:#16342f; --warn:#f0b36a; --warn-soft:#3a2b14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#172221; --fg:#e6efee; --muted:#93a8a5; --line:#273837;
  --accent:#3fc2ad; --accent-soft:#16342f; --warn:#f0b36a; --warn-soft:#3a2b14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.02em}
.month{color:var(--muted);font-size:13px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.big{font-size:clamp(38px,12vw,56px);font-weight:600;line-height:1.1;margin:4px 0 14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.stat b{display:block;font-size:17px;font-weight:600}
.stat.neg b{color:var(--warn)}
.income{display:flex;align-items:center;gap:6px}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.income input{width:100%;font-family:var(--mono);font-weight:600;font-size:17px;padding:2px 6px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer}
li .name{overflow-wrap:anywhere}
li.cat{background:var(--bg);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);justify-content:space-between;border-radius:10px 10px 0 0}
li.cat:not(:first-child){border-radius:0}
li .due{display:block;font-size:12px;color:var(--muted)}
li input[type=checkbox]{appearance:none;width:22px;height:22px;flex:none;border:2px solid var(--muted);border-radius:6px;padding:0;background:transparent;cursor:pointer;display:grid;place-content:center}
li input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
li input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
li.paid .name{text-decoration:line-through;color:var(--muted)}
li.paid .amt{color:var(--muted)}
.amt{width:92px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;background:transparent;border-color:transparent;padding:5px 6px}
.amt:hover{border-color:var(--line)}
.del{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:6px}
.del:hover{color:var(--warn);background:var(--warn-soft)}
.empty{padding:20px 14px;color:var(--muted);text-align:center}
form{display:grid;grid-template-columns:minmax(0,1fr) 96px minmax(0,1fr) auto;gap:8px}
form button,.reset{font:inherit;font-weight:600;border-radius:6px;cursor:pointer}
form button{background:var(--accent);color:var(--bg);border:0;padding:7px 14px}
.reset{background:none;border:1px solid var(--line);color:var(--muted);padding:8px 12px;align-self:flex-start}
.reset:hover{color:var(--fg);border-color:var(--muted)}
@media (max-width:460px){form{grid-template-columns:minmax(0,1fr) 1fr 1fr}form button{grid-column:1/-1;padding:10px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

<main>
  <header><h1>Monthly outgoings</h1><span class="month" id="month"></span></header>

  <section class="hero" aria-live="polite">
    <div class="label">Still to pay</div>
    <div class="big num" id="remaining">£0.00</div>
    <div class="bar"><i id="progress"></i></div>
    <div class="stats">
      <div class="stat"><span class="label">Paid</span><b class="num" id="paid">£0</b></div>
      <div class="stat"><span class="label">Total</span><b class="num" id="total">£0</b></div>
      <div class="stat" id="freeStat"><span class="label">Free after bills</span><b class="num" id="free">£0</b></div>
    </div>
    <div class="income" style="margin-top:14px"><label class="label" for="income">Monthly income (optional) £</label><input id="income" class="num" type="number" inputmode="decimal" min="0" step="0.01"></div>
  </section>

  <div class="note" id="note" hidden>These are example outgoings. Change the amounts, delete them and add your own.</div>
  <ul id="list"></ul>

  <form id="add">
    <input id="newName" placeholder="Outgoing (e.g. Gym)" required aria-label="Name">
    <input id="newAmt" class="num" type="number" inputmode="decimal" min="0" step="0.01" placeholder="£ amount" required aria-label="Amount">
    <input id="newCat" list="cats" placeholder="Group" aria-label="Group"><datalist id="cats"><option value="Car"><option value="Subscriptions"><option value="Everything else"></datalist>
    <button type="submit">Add</button>
  </form>
  <button class="reset" id="reset" type="button">Start new month (untick all)</button>
</main>

<script>
(function(){
  var KEY='outgoings-v1', ref=null, saveTimer=null;
  var gbp=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'});
  var thisMonth=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
  var uid=function(){return Math.random().toString(36).slice(2,9)};
  var state={income:0,month:thisMonth(),example:false,items:[{id:'s0',cat:'Car',name:'Car insurance',amount:144,day:0,paid:false},{id:'s1',cat:'Car',name:'Fuel 1',amount:60,day:0,paid:false},{id:'s1b',cat:'Car',name:'Fuel 2',amount:60,day:0,paid:false},{id:'s2',cat:'Car',name:'Maintenance pot',amount:30,day:0,paid:false},{id:'s3',cat:'Subscriptions',name:'Apple',amount:19,day:0,paid:false},{id:'s4',cat:'Subscriptions',name:'Amazon',amount:7.5,day:0,paid:false},{id:'s5',cat:'Subscriptions',name:'SoundCloud',amount:6,day:0,paid:false},{id:'s6',cat:'Subscriptions',name:'Claude',amount:18,day:0,paid:false},{id:'s7',cat:'Subscriptions',name:'Gym',amount:28,day:0,paid:false},{id:'s8',cat:'Subscriptions',name:'Now TV',amount:28,day:0,paid:false},{id:'s9',cat:'Subscriptions',name:'Phone',amount:20,day:0,paid:false},{id:'s10',cat:'Everything else',name:'Haircut 1',amount:16,day:0,paid:false},{id:'s10b',cat:'Everything else',name:'Haircut 2',amount:16,day:0,paid:false},{id:'s11',cat:'Everything else',name:'Toiletries',amount:10,day:0,paid:false},{id:'s12',cat:'Everything else',name:'Food shop 1',amount:50,day:0,paid:false},{id:'s12b',cat:'Everything else',name:'Food shop 2',amount:50,day:0,paid:false},{id:'s12c',cat:'Everything else',name:'Food shop 3',amount:50,day:0,paid:false},{id:'s12d',cat:'Everything else',name:'Food shop 4',amount:50,day:0,paid:false},{id:'s13',cat:'Everything else',name:'Rent 1',amount:50,day:0,paid:false},{id:'s13b',cat:'Everything else',name:'Rent 2',amount:50,day:0,paid:false}]};
  var $=function(id){return document.getElementById(id)};

  function load(raw){
    if(!raw||!Array.isArray(raw.items))return;
    state=raw;
    var changed=false;
    function split(id,cat,base,n,each,ids){
      var k=state.items.findIndex(function(i){return i.id===id&&i.amount===each*n});
      if(k<0)return;
      var p=state.items[k].paid,parts=[];
      for(var j=0;j<n;j++)parts.push({id:ids[j],cat:cat,name:base+' '+(j+1),amount:each,day:0,paid:j===0&&p});
      state.items.splice.apply(state.items,[k,1].concat(parts));changed=true;
    }
    split('s1','Car','Fuel',2,60,['s1','s1b']);
    split('s10','Everything else','Haircut',2,16,['s10','s10b']);
    split('s13','Everything else','Rent',2,50,['s13','s13b']);
    split('s12','Everything else','Food shop',4,50,['s12','s12b','s12c','s12d']);
    if(changed)save();
    if(state.month!==thisMonth()){state.month=thisMonth();state.items.forEach(function(i){i.paid=false});save()}
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){if(ref)ref.set(JSON.parse(JSON.stringify(state))).catch(function(){})},400);
  }
  function edited(){state.example=false;save();render()}

  function render(){
    var total=0,paid=0;
    state.items.forEach(function(i){total+=i.amount;if(i.paid)paid+=i.amount});
    var free=state.income-total;
    $('month').textContent=new Date().toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    $('remaining').textContent=gbp.format(total-paid);
    $('paid').textContent=gbp.format(paid);
    $('total').textContent=gbp.format(total);
    $('free').textContent=gbp.format(free);
    $('freeStat').classList.toggle('neg',free<0);$('freeStat').hidden=!state.income;
    $('progress').style.width=(total?Math.round(paid/total*100):0)+'%';
    $('note').hidden=!state.example;
    if(document.activeElement!==$('income'))$('income').value=state.income;
    var list=$('list');list.textContent='';
    if(!state.items.length){var e=document.createElement('li');e.className='empty';e.textContent='No outgoings yet. Add your first one below.';list.appendChild(e)}
    var cats=[];state.items.forEach(function(i){if(cats.indexOf(i.cat)<0)cats.push(i.cat)});
    cats.forEach(function(cat){
      var group=state.items.filter(function(i){return i.cat===cat});
      var left=0;group.forEach(function(i){if(!i.paid)left+=i.amount});
      var h=document.createElement('li');h.className='cat';
      var hn=document.createElement('span');hn.textContent=cat;
      var hv=document.createElement('span');hv.className='num';hv.textContent=gbp.format(left)+' left';
      h.append(hn,hv);list.appendChild(h);
      group.forEach(function(it){
      var li=document.createElement('li');if(it.paid)li.className='paid';
      var lab=document.createElement('label');
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=it.paid;cb.setAttribute('aria-label','Paid: '+it.name);
      cb.onchange=function(){it.paid=cb.checked;save();render()};
      var n=document.createElement('span');n.className='name';n.textContent=it.name;
      lab.append(cb,n);
      var amt=document.createElement('input');amt.className='amt';amt.type='number';amt.step='0.01';amt.min='0';amt.value=it.amount;amt.setAttribute('aria-label','Amount for '+it.name);
      amt.onchange=function(){var v=parseFloat(amt.value);if(isNaN(v)||v<0)v=0;it.amount=v;edited()};
      var del=document.createElement('button');del.className='del';del.type='button';del.textContent='\u00d7';del.setAttribute('aria-label','Delete '+it.name);
      del.onclick=function(){state.items=state.items.filter(function(x){return x.id!==it.id});edited()};
      li.append(lab,amt,del);list.appendChild(li);
      });
    });
  }
  function ord(n){if(n%100>=11&&n%100<=13)return 'th';return ({1:'st',2:'nd',3:'rd'})[n%10]||'th'}

  $('income').oninput=function(){var v=parseFloat($('income').value);state.income=isNaN(v)?0:v;save();render()};
  $('add').onsubmit=function(ev){
    ev.preventDefault();
    var a=parseFloat($('newAmt').value);
    if(isNaN(a)||!$('newName').value.trim())return;
    if(state.example){state.items=[]}
    state.items.push({id:uid(),name:$('newName').value.trim(),amount:a,day:0,cat:$('newCat').value.trim()||'Other',paid:false});
    $('add').reset();edited();$('newName').focus();
  };
  $('reset').onclick=function(){state.items.forEach(function(i){i.paid=false});state.month=thisMonth();save();render()};

  try{var raw=localStorage.getItem(KEY);if(raw)load(JSON.parse(raw))}catch(e){}
  render();

  if(window.claude&&claude.use){
    Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return;
      return user.id().then(function(id){
        if(!id)return;
        ref=db.doc('data/users/'+id+'/tracker');
        return ref.get().then(function(s){
          if(s.exists){load(s.data());try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}render()}
          else if(!state.example){save()}
        });
      });
    }).catch(function(){});
  }
})();
</script>

</body></html>
